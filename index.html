<!DOCTYPE html>
<html lang="en">
<head>
<meta name="p:domain_verify" content="948c2d9817219fff61d01d39e4835ea7"/>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melon Glow Books</title>
<meta name="description" content="Step inside Melon Glow Books — bedtime stories and plain-English health guides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:#0c0a06; overflow:hidden;}
  a{text-decoration:none;}

  .stage{
    position:relative;
    width:100%; height:100vh;
    overflow:hidden;
  }
  .stage img.bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 38%;
    filter:saturate(1.05);
  }
  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 62%, rgba(0,0,0,0) 18%, rgba(8,6,2,0.55) 78%);
    pointer-events:none;
  }
  .topfade{
    position:absolute; top:0; left:0; right:0; height:160px;
    background:linear-gradient(to bottom, rgba(8,6,2,0.65), rgba(8,6,2,0));
    pointer-events:none;
  }

  .heading{
    position:absolute; top:34px; left:0; right:0;
    text-align:center; z-index:5; pointer-events:none;
  }
  .heading .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:.7rem;
    letter-spacing:.18em; text-transform:uppercase; color:#C9A227;
    margin:0;
  }
  .heading h1{
    font-family:'Lora', serif; font-weight:600; color:#FBF6EC;
    font-size:clamp(1.3rem, 3vw, 1.9rem);
    margin:6px 0 0;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }

  .hotspot{
    position:absolute;
    left:50%; top:67%;
    width:min(34vw, 320px); height:min(25vw, 230px);
    transform:translate(-50%,-50%);
    border-radius:14px;
    cursor:pointer;
    display:flex; align-items:flex-end; justify-content:center;
    z-index:6;
  }
  .hotspot .ring{
    position:absolute; inset:-6px;
    border-radius:18px;
    border:2px solid rgba(201,162,39,0.0);
    box-shadow:0 0 0 0 rgba(201,162,39,0.0);
    transition:border-color .25s ease, box-shadow .25s ease;
  }
  .hotspot:hover .ring, .hotspot:focus-visible .ring{
    border-color:rgba(201,162,39,0.85);
    box-shadow:0 0 38px 6px rgba(201,162,39,0.35);
  }
  .hotspot:focus-visible{ outline:none; }

  @media (prefers-reduced-motion: no-preference){
    .hotspot .ring{ animation:pulse 2.6s ease-in-out infinite; }
  }
  @keyframes pulse{
    0%, 100%{ box-shadow:0 0 16px 2px rgba(201,162,39,0.18); border-color:rgba(201,162,39,0.35); }
    50%{ box-shadow:0 0 30px 5px rgba(201,162,39,0.3); border-color:rgba(201,162,39,0.6); }
  }

  .enter-label{
    position:relative; z-index:7;
    margin-bottom:-34px;
    font-family:'IBM Plex Mono', monospace; font-size:.7rem;
    letter-spacing:.12em; text-transform:uppercase;
    color:#FBF6EC; background:rgba(20,16,8,0.55);
    padding:7px 16px; border-radius:20px;
    border:1px solid rgba(201,162,39,0.5);
    opacity:0; transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .hotspot:hover .enter-label, .hotspot:focus-visible .enter-label{
    opacity:1; transform:translateY(0);
  }

  .skip{
    position:absolute; bottom:22px; right:22px; z-index:6;
    font-family:'IBM Plex Mono', monospace; font-size:.7rem;
    letter-spacing:.08em; color:#D8DCEA;
    background:rgba(20,16,8,0.45);
    padding:8px 14px; border-radius:20px;
    border:1px solid rgba(255,255,255,0.18);
  }
  .skip:hover{ border-color:rgba(201,162,39,0.6); color:#FBF6EC; }
</style>
</head>
<body>

<div class="stage">
  <img class="bg" src="library.jpg" alt="A grand library, with an open book reading Melon Glow Books at its center.">
  <div class="topfade"></div>
  <div class="vignette"></div>

  <div class="heading">
    <p class="eyebrow">Melon Glow Books</p>
    <h1>Step inside.</h1>
  </div>

  <a class="hotspot" href="home.html" aria-label="Enter Melon Glow Books">
    <span class="ring" aria-hidden="true"></span>
    <span class="enter-label">Open the book</span>
  </a>

  <a class="skip" href="home.html">Skip intro →</a>
</div>

</body>
</html>
