<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banish Pain</title>
</head>
<body>
<p>Loading books…</p>
<script>
fetch("https://cdn.jsdelivr.net/gh/drcarey-del/melonglowbooks-site@de92f1af3a7ba5e462cfedbe509eb52adfc09466/banishpain/index.html")
  .then(function(r){ return r.text(); })
  .then(function(html){
    document.open(); document.write(html); document.close();
    var links = {
      "https://buy.stripe.com/7sYfZh4Si6u7fwHftO8so09": ["https://buy.stripe.com/28E3cv5WmbOrckva9u8so0o","UK \u00a312.99","https://buy.stripe.com/cNibJ1acC2dR98j0yU8so0p","Europe \u00a322"],
      "https://buy.stripe.com/6oUfZhesSbOr3NZa9u8so0b": ["https://buy.stripe.com/fZu4gz5Wm3hV70b4Pa8so0s","UK \u00a318.99","https://buy.stripe.com/7sY8wP2Ka19N5W7ftO8so0t","Europe \u00a334"]
    };
    Object.keys(links).forEach(function(us){
      var a = document.querySelector('a[href="'+us+'"]');
      if(!a) return;
      var pair = links[us];
      var uk = document.createElement("a");
      uk.className = "btn"; uk.href = pair[0]; uk.target = "_blank"; uk.rel = "noopener"; uk.textContent = pair[1]; uk.style.marginLeft = "8px";
      var eu = document.createElement("a");
      eu.className = "btn"; eu.href = pair[2]; eu.target = "_blank"; eu.rel = "noopener"; eu.textContent = pair[3]; eu.style.marginLeft = "8px";
      a.insertAdjacentElement("afterend", eu);
      a.insertAdjacentElement("afterend", uk);
    });
    function openCover(ev){
      var src = ev.currentTarget.src;
      var box = document.createElement("div");
      box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(8,10,16,.88);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;";
      var big = document.createElement("img");
      big.src = src;
      big.alt = "Diabetic Foot Care Handbook cover, large";
      big.style.cssText = "max-width:min(920px,94vw);max-height:94vh;width:auto;height:auto;box-shadow:0 24px 80px rgba(0,0,0,.45);";
      box.appendChild(big);
      function close(){ box.remove(); document.removeEventListener("keydown", onKey); }
      function onKey(e){ if(e.key === "Escape") close(); }
      box.addEventListener("click", close);
      document.addEventListener("keydown", onKey);
      document.body.appendChild(box);
    }
    var old = document.querySelector('a[href="https://buy.stripe.com/bJefZhbgG2dR84fchC8so0a"]');
    if(!old) return;
    var section = old.closest("section");
    var h2 = section.querySelector("h2");
    if(h2) h2.textContent = "Diabetic Foot Care Handbook";
    var cover = section.querySelector(".cover");
    if(cover){
      cover.style.maxWidth = "560px";
      cover.style.display = "flex";
      cover.style.gap = "18px";
      cover.style.alignItems = "flex-start";
      cover.innerHTML = "";
      ["Hardback","Paperback"].forEach(function(label){
        var fig = document.createElement("figure");
        fig.style.margin = "0";
        fig.style.flex = "1";
        var im = document.createElement("img");
        im.src = "/cover-diabetic-handbook.jpg?v=20261005";
        im.alt = "Diabetic Foot Care Handbook, " + label;
        im.style.width = "100%";
        im.style.height = "auto";
        im.style.display = "block";
        im.style.cursor = "zoom-in";
        im.title = "Click to enlarge";
        im.addEventListener("click", openCover);
        var cap = document.createElement("figcaption");
        cap.textContent = label + " · click to enlarge";
        cap.style.textAlign = "center";
        cap.style.marginTop = "8px";
        cap.style.fontSize = "14px";
        fig.appendChild(im);
        fig.appendChild(cap);
        cover.appendChild(fig);
      });
      var wrap = section.querySelector(".wrap");
      if(wrap && window.innerWidth > 860) wrap.style.gridTemplateColumns = "1fr 560px";
    }
    var sub = section.querySelector(".sub");
    if(sub) sub.textContent = "The Glass Foot: A Guide to Healing, Happiness & Relief";
    var desc = section.querySelector(".desc");
    if(desc) desc.textContent = "A diagnosis of diabetes is a life-changing event. This book shows where the foot begins to fail, and what to do the same day.";
    function row(label, buttons){
      var d = document.createElement("div");
      d.className = "buy-row";
      d.style.marginTop = "12px";
      var price = document.createElement("span");
      price.className = "price";
      price.textContent = label;
      d.appendChild(price);
      buttons.forEach(function(b, i){
        var a = document.createElement("a");
        a.className = "btn";
        a.href = b[0];
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = b[1];
        if(i) a.style.marginLeft = "8px";
        d.appendChild(a);
      });
      return d;
    }
    var hardback = row("Hardback", [
      ["https://book.stripe.com/3cI3cvdoO05JfwHgxS8so0M", "USA $16.99"],
      ["https://book.stripe.com/5kQ00jckK3hV1FRa9u8so0N", "UK \u00a316.99"],
      ["https://book.stripe.com/fZu4gzgB019N2JV3L68so0O", "Europe \u20ac19.99"]
    ]);
    var paperback = row("Paperback", [
      ["https://book.stripe.com/8x2aEXckK2dR0BN0yU8so0P", "USA $12.99"],
      ["https://book.stripe.com/cNicN5gB05q3doz2H28so0Q", "UK \u00a312.99"],
      ["https://book.stripe.com/fZu14n2KaaKn5W7a9u8so0R", "Europe \u20ac14.99"]
    ]);
    var buy = old.closest(".buy-row");
    buy.insertAdjacentElement("afterend", paperback);
    buy.insertAdjacentElement("afterend", hardback);
    buy.remove();
  });
</script>
</body>
</html>
